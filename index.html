<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosquito Slayer</title>
<meta name="theme-color" content="#0b1a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1a3a;--gold:#ffd54a;--pink:#ff5d8f;--ink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow:hidden}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none;display:none}
#row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px}
#bar{margin-top:8px;height:16px;border-radius:9px;background:#ffffff26;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#7dffb0,#ffd54a,#ff4d4d);transition:width .2s}
#lbl{font-size:12px;opacity:.75;margin-top:3px}
#snd{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:48px;height:48px;border-radius:50%;border:0;background:#ffffff26;font-size:22px;z-index:5}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#050c1fcc;text-align:center;padding:24px;z-index:4}
.scr.hide{display:none}
h1{font-size:36px;margin:0;color:var(--gold);text-shadow:0 4px 0 #b5481a}
h2{font-size:34px;margin:0;color:var(--pink)}
p{margin:0;font-size:18px;opacity:.9}
.tag{font-size:17px;opacity:.9;max-width:300px}
.how{font-size:14px;opacity:.7;line-height:1.5}
#hero{position:relative;width:min(80vw,310px);height:175px}
#hb{position:absolute;left:0;bottom:0;width:100%}
#hmw{position:absolute;top:-6px;left:52%;width:96px;height:96px;animation:fl 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 8px #000a)}
#hmw img{position:absolute;inset:0;width:100%;height:100%;transform:rotate(180deg)}
@keyframes fl{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(-26px,16px) rotate(8deg)}}
.dd{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:340px}.dd div{width:42px;padding:6px 0;border-radius:10px;background:#ffffff18;font-size:12px}.dd .cur{background:#ffd54a;color:#3a1d00;font-weight:900}.dd .done{opacity:.4}
.big{font-size:56px;font-weight:900;color:var(--gold)}
.btn{font:inherit;font-weight:900;font-size:26px;padding:16px 52px;border:0;border-radius:40px;background:var(--gold);color:#3a1d00;box-shadow:0 6px 0 #b5481a;margin-top:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b5481a}
.alt{background:#fff;font-size:20px;padding:12px 36px;box-shadow:0 5px 0 #8a8fa8;margin-top:0}
#shop{justify-content:flex-start;overflow-y:auto;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:#050c1ff5}
#shop h3{margin:6px 0 0;font-size:18px}
.it{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;box-sizing:border-box;background:#ffffff14;border-radius:16px;padding:10px 12px;text-align:left}
.ic{font-size:30px}.tx{flex:1;font-size:16px}.tx small{opacity:.75;font-size:13px}.tx span{color:#ffd54a;letter-spacing:2px;font-size:12px}
.it button,.tr button{font:inherit;font-weight:800;border:2px solid transparent;border-radius:14px;padding:10px 12px;background:#ffd54a;color:#3a1d00}
.it button:disabled{background:#556;color:#aab}
.tr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tr button{background:#ffffff1a;color:#fff;font-size:14px}.tr button.sel{background:#2d6a4f}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="row"><span id="sc">0</span><span id="wv">Wave 1</span><span id="cb"></span></div>
<div id="bar"><div id="fill"></div></div><div id="lbl">Baby bite meter</div></div>
<button id="snd" aria-label="Sound">🔊</button>

<div class="scr" id="start"><div id="hero"><img id="hb" alt=""><div id="hmw"><img id="hm1" alt=""><img id="hm2" alt=""></div></div><h1>Mosquito Slayer</h1>
<p class="tag">Protect the sleeping baby from the mosquitoes</p><p class="how">Tap = free &nbsp;•&nbsp; Swipe = uses milk<br>Don't hit the butterflies</p><p id="bs">Best: 0</p>
<button class="btn" id="play">Play</button><button class="btn alt" id="shopS">🛒 Shop</button></div>

<div class="scr hide" id="over"><h2>Baby woke up crying!</h2><p>Score</p><div class="big" id="fs">0</div>
<p id="fb">Best: 0</p><p id="fc"></p><button class="btn" id="again">Restart</button><button class="btn alt" id="shopO">🛒 Shop</button></div>
<div class="scr hide" id="shop"></div>
<div class="scr hide" id="win"><div style="font-size:60px">🌅</div><h2 style="color:#ffd54a">Good morning!</h2><p>The baby slept safely all night</p>
<div class="big" id="ws">0</div><p>+100 coins bonus</p><button class="btn" id="keep">Keep going</button><button class="btn alt" id="again2">Play again</button></div>
<div class="scr hide" id="daily"></div>

<script>
// ===== SETUP =====
const IM={};for(const k in IMG){IM[k]=new Image();IM[k].src=IMG[k]} // photo sprites
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H;
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();

// ===== SOUND (Web Audio, no files) =====
let AC,snd=true;
function tone(f,d,type,v,slide){
  if(!snd)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,n);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
    g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);
  }catch(e){}
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const sfx={
  splat(){tone(700,.09,'sine',.2,-450);tone(160,.14,'square',.08,-80)},
  miss(){tone(130,.1,'triangle',.12)},
  bite(){tone(320,.22,'sawtooth',.13,-220)},
  wave(){tone(520,.12,'sine',.15);setTimeout(()=>tone(780,.16,'sine',.15),120)},
  over(){tone(420,.6,'sawtooth',.2,-320)}
};
// formant voice: sawtooth through 2 band-pass filters = baby-like vowel
function voice(f0,f1,dur,v,fa,fb,vib){
  if(!snd)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),b1=AC.createBiquadFilter(),b2=AC.createBiquadFilter(),lf=AC.createOscillator(),lg=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(f0,n);o.frequency.linearRampToValueAtTime(f1,n+dur);
    lf.frequency.value=vib?7:1;lg.gain.value=vib||0;lf.connect(lg);lg.connect(o.frequency);
    b1.type=b2.type='bandpass';b1.frequency.value=fa;b2.frequency.value=fb;b1.Q.value=b2.Q.value=5;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.05);g.gain.linearRampToValueAtTime(0,n+dur);
    o.connect(b1);o.connect(b2);b1.connect(g);b2.connect(g);g.connect(AC.destination);
    o.start(n);lf.start(n);o.stop(n+dur+.05);lf.stop(n+dur+.05);
  }catch(e){}
}
function hiss(dur,v,fc){ // breath noise
  if(!snd||!AC)return;
  try{const n=AC.currentTime,b=AC.createBuffer(1,AC.sampleRate*dur|0,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const sr=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    sr.buffer=b;f.type='bandpass';f.frequency.value=fc;f.Q.value=.8;
    g.gain.setValueAtTime(v,n);g.gain.linearRampToValueAtTime(0,n+dur);
    sr.connect(f);f.connect(g);g.connect(AC.destination);sr.start(n);
  }catch(e){}
}
// baby giggle: breathy "heh-heh-heh", high pitch, falling glide per syllable, fading out
sfx.giggle=()=>{for(let i=0;i<7;i++)setTimeout(()=>{
  const f=640-i*22+Math.random()*50,v=1-i*.1;
  hiss(.06,.25*v,3200);voice(f,f*.8,.11,.9*v,880,2600,0)},i*125)};
sfx.fuss=()=>voice(380,330,.35,.7,800,2200,8);
sfx.cry=()=>{voice(430,600,.5,1.1,950,2400,14);setTimeout(()=>voice(600,380,.6,1.1,950,2400,14),520)};
sfx.cryLoop=()=>{for(let i=0;i<3;i++)setTimeout(sfx.cry,i*1250)};
// continuous mosquito buzz: louder + higher as mosquitoes get close to the baby
let BZ=null;
function buzzInit(){
  if(BZ||!AC)return;
  try{const g=AC.createGain(),f=AC.createBiquadFilter(),o1=AC.createOscillator(),o2=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain();
    g.gain.value=0;f.type='bandpass';f.frequency.value=800;f.Q.value=1.1;
    o1.type=o2.type='sawtooth';o1.frequency.value=440;o2.frequency.value=455;
    lf.frequency.value=9;lg.gain.value=16;lf.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(AC.destination);o1.start();o2.start();lf.start();BZ={g,o1,o2};
  }catch(e){}
}
function buzzUpdate(){
  if(!BZ)return;let v=0,fq=440;
  if(snd&&st==='play'&&ms.length){let nd=1e9;for(const m of ms)nd=Math.min(nd,Math.hypot(m.x-W/2,m.y-(H-170)));
    const near=Math.max(0,1-nd/H);v=Math.min(.08,.014+.05*near+.003*ms.length);
    fq=ms.some(m=>m.type==='boss')?300:420+near*170}
  const n=AC.currentTime;BZ.g.gain.setTargetAtTime(v,n,.1);BZ.o1.frequency.setTargetAtTime(fq,n,.1);BZ.o2.frequency.setTargetAtTime(fq*1.03,n,.1);
}
// ===== BETTER BABY VOICE: glottal-style wave + 2 moving formants + breath noise =====
let NB=null,GW=null;
function baby(f0,f1,dur,v,F1a,F1b,F2,vib,breath){
  if(!snd)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(!GW){const re=new Float32Array(24),im=new Float32Array(24);for(let i=1;i<24;i++)im[i]=1/Math.pow(i,1.1);GW=AC.createPeriodicWave(re,im)}
    const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),b1=AC.createBiquadFilter(),b2=AC.createBiquadFilter(),
      lf=AC.createOscillator(),lg=AC.createGain(),ns=AC.createBufferSource(),ng=AC.createGain(),nf=AC.createBiquadFilter();
    o.setPeriodicWave(GW);o.frequency.setValueAtTime(f0,n);o.frequency.linearRampToValueAtTime(f1,n+dur);
    lf.frequency.value=vib?6.5:1;lg.gain.value=vib||0;lf.connect(lg);lg.connect(o.frequency);
    b1.type=b2.type='bandpass';b1.Q.value=6;b2.Q.value=8;
    b1.frequency.setValueAtTime(F1a,n);b1.frequency.linearRampToValueAtTime(F1b,n+dur);b2.frequency.value=F2;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.04);g.gain.setValueAtTime(v,n+dur*.6);g.gain.linearRampToValueAtTime(0,n+dur);
    ns.buffer=NB;ns.loop=true;ng.gain.value=breath||0;nf.type='bandpass';nf.frequency.value=F2;nf.Q.value=.8;
    ns.connect(nf);nf.connect(ng);ng.connect(g);
    o.connect(b1);o.connect(b2);b1.connect(g);b2.connect(g);g.connect(AC.destination);
    o.start(n);lf.start(n);ns.start(n);const e=n+dur+.05;o.stop(e);lf.stop(e);ns.stop(e);
  }catch(e){}
}
// giggle = quick breathy "heh-heh-heh" bursts, pitch drifting down
sfx.giggle=()=>{for(let i=0;i<7;i++)setTimeout(()=>baby(540-i*15,480-i*15,.09,2*(1-i*.08),900,1050,2700,0,.5),i*125)};

function begin(){ // instant restart
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}buzzInit();loadSnd();stopCry();
  score=0;combo=0;wave=0;bites=0;ms=[];ps=[];tx=[];run=0;won=false;comboT=0;dark=0;wonT=0;$('win').classList.add('hide');MAX_BITES=8+SV.up.baby;its=[];slow=0;big=null;tsT=0;milk=100;locked=false;frenzy=0;idle=0;t=0;shake=0;flash=0;
  $('start').classList.add('hide');$('over').classList.add('hide');
  $('hud').style.display='block';st='play';nextWave();hud();
}
function nextWave(){
  wave++;spawnLeft=4+wave*2;spawnT=0;banner=1.5;sfx.wave();swarm=wave%3===0&&wave%5!==0;if(swarm)spawnLeft+=6;
  if(wave%5===0){mk('boss',W/2,-90);spawnLeft=Math.floor(spawnLeft/2)} // boss wave
  if(wave%7===0&&wave%5!==0){dark=9;tone(70,.7,'sawtooth',.2,-30)} // lights-out event
  if(wave>1){score+=50*wave;run+=wave*2;float('Wave bonus +'+50*wave,W/2,H*.45,'#7dffb0')}
}
function mk(type,x,y){
  const base=H*(.15+wave*.014);
  const o={type,bx:x,x,y,amp:20+Math.random()*30,f:2+Math.random()*2,ph:Math.random()*6.28,hp:1,sz:46,sp:base,hov:0};
  if(type==='fast')o.sp=base*1.5;
  if(type==='tough'){o.hp=o.hp0=3;o.sz=60;o.sp=base*.8}
  if(type==='split'){o.sz=54;o.sp=base*.9}
  if(type==='mini'){o.sz=34;o.sp=base*1.3}
  if(type==='boss'){o.hp=o.hp0=10+wave;o.sz=100;o.sp=H*.04;o.amp=70}
  if(type==='boss')o.nt=2;
  if(type==='fly'){o.sz=46;o.sp=base*.7;o.amp=90}
  if(type==='gold'){o.sz=42;o.sp=base*2.4;o.amp=110;o.f=4}
  o.sp=Math.min(o.sp,H*.5);ms.push(o);return o;
}
function spawn(){ // always enters from the TOP
  const r=Math.random(),x=W*.14+Math.random()*W*.72;
  if(wave>=2&&Math.random()<.04){mk('gold',x,-40);return} // rare golden mosquito: fast, big reward
  if(wave>=3&&Math.random()<.12){mk('fly',x,-40);return} // harmless butterfly: don't hit!
  mk(wave>=4&&r<.15?'split':wave>=3&&r<.35?'tough':wave>=2&&r<.6?'fast':'norm',x,-40);
}
function damage(m,n){
  if(m.type==='fly'){ms.splice(ms.indexOf(m),1);combo=0;milk=Math.max(0,milk-25);score=Math.max(0,score-20);
    float('Oops! -20',m.x,m.y,'#ff8f8f');tone(120,.25,'sawtooth',.15,-60);vib(80);hud();return}
  m.hp-=n;m.hit=.12;
  if(m.hp>0){tone(300,.06,'square',.1);burst(m.x,m.y,4);return}
  ms.splice(ms.indexOf(m),1);combo++;comboT=2.4;
  const MS={3:'NICE!',6:'GREAT!',10:'FRENZY!',15:'UNSTOPPABLE!',20:'LEGEND!'};
  if(combo===10){frenzy=6+SV.up.frenzy*1.5;vib([30,30,60])}
  if(combo===3||combo===10||combo===20){babyHappy=1.6;sfx.giggle()}
  if(MS[combo]){big={s:MS[combo],l:1};tone(600+combo*20,.25,'square',.12,500)};
  const pts=({norm:10,fast:20,tough:40,split:30,mini:10,boss:300,gold:100})[m.type]*mult();
  score+=pts;run+=m.type==='boss'?25:m.type==='gold'?15:m.type==='mini'?0:1;burst(m.x,m.y,m.type==='boss'?30:14);float('+'+pts,m.x,m.y,'#ffd54a');
  shake=m.type==='boss'?16:5;sfx.splat();tone(500+Math.min(combo,12)*60,.08,'triangle',.1);vib(m.type==='boss'?[60,40,120]:15);if(m.type==='boss')tsT=.8;
  if(m.warn){score+=50;big={s:'CLOSE CALL! +50',l:1};tsT=.45;tone(1000,.2,'square',.12,-500)}
  if(m.type==='gold'){float('GOLD! +15 coins',m.x,m.y-20,'#ffd54a');tone(1200,.3,'sine',.15,600)}
  if(m.type==='split'){mk('mini',m.x-24,m.y);mk('mini',m.x+24,m.y)}
  if(m.type!=='mini'&&Math.random()<.12)its.push({k:['zap','slow','milk'][Math.random()*3|0],x:m.x,y:m.y,vy:70,l:7});
}
function usePU(p){
  if(p.k==='zap'){ms.filter(m=>m.type!=='fly').forEach(m=>damage(m,m.type==='boss'?4:99));shake=16;flash=.2;tone(900,.3,'sawtooth',.15,-700);float('ZAP!',W/2,H*.4,'#ffd54a')}
  else if(p.k==='milk'){milk=100;locked=false;bites=Math.max(0,bites-1);float('MILK! baby healed',W/2,H*.4,'#fffdf5');tone(700,.25,'sine',.15,400)}
  else{slow=5;tone(300,.3,'sine',.15,300);float('SLOW 5s',W/2,H*.4,'#8fd0ff')}
}
function float(s,x,y,c){tx.push({s,x,y,c,l:.9})}
function burst(x,y,n){for(let i=0;i<(n||12);i++){const a=Math.random()*6.28,v=80+Math.random()*160;
  ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5,c:i%3?'#7dffb0':'#ff5d8f'})}}
function clock(){const m=(21*60+(wave-1)*45)%1440,h=Math.floor(m/60);return((h%12)||12)+':'+String(m%60).padStart(2,'0')+(h<12?' AM':' PM')}
function hud(){
  $('sc').textContent=score;$('wv').textContent='Wave '+wave+' • '+clock();
  $('cb').textContent=(mult()>1?'x'+mult()+' 🔥 ':'')+'🪙'+run;
  $('fill').style.width=(bites/MAX_BITES*100)+'%';
}

let down=false,trail=[];
function tap(px,py,swipe){
  for(const p of its){if(Math.hypot(p.x-px,p.y-py)<58){its.splice(its.indexOf(p),1);usePU(p);hud();return}}
  let hit=null,bd=1e9;
  for(const m of ms){const d=Math.hypot(m.x-px,m.y-py);if(d<m.sz*.5+(swipe?(frenzy>0?34:16):28)+SV.up.aim*4&&d<bd){bd=d;hit=m}}
  if(hit){damage(hit,1);hud()}
  else if(!swipe){combo=0;sfx.miss();float('miss',px,py,'#ffffff88');hud()}
}
function pt(e){const r=cv.getBoundingClientRect();lx=e.clientX-r.left;ly=e.clientY-r.top;return[lx,ly]}
cv.addEventListener('pointerdown',e=>{if(st!=='play')return;if(AC&&AC.state==='suspended')AC.resume();
  down=true;const[x,y]=pt(e);trail=[{x,y,l:.25}];tap(x,y,false)});
cv.addEventListener('pointermove',e=>{
  if(!down||st!=='play')return;const[x,y]=pt(e);
  const l=trail[trail.length-1],d=l?Math.hypot(x-l.x,y-l.y):0;
  if(frenzy<=0){ // swiping drains milk (AD HOOK: rewarded "refill milk" here)
    if(locked)return;
    milk=Math.max(0,milk-d*.07*(1-.12*SV.up.bottle));idle=0;
    if(milk<=0){locked=true;float('NO MILK! Tap only',W/2,H*.5,'#ff8f8f');tone(150,.3,'sawtooth',.15,-80)}
  }
  trail.push({x,y,l:.25});tap(x,y,true)});
addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);

const SN={},_g=sfx.giggle,_c=sfx.cry,_f=sfx.fuss,_l=sfx.cryLoop;let cryEnd=0,curCry=null;function stopCry(){try{curCry&&curCry.stop()}catch(e){}curCry=null;cryEnd=0}
function loadSnd(){
  if(SN.on||!AC)return;SN.on=1;
  for(const k in SND){try{const b=atob(SND[k].split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    AC.decodeAudioData(u.buffer,x=>{SN[k]=x},()=>{})}catch(e){}}
}
function play(k,vol,off,dur){
  if(!snd||!SN[k]||!AC)return false;
  try{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=SN[k];g.gain.value=vol;s.connect(g);g.connect(AC.destination);s.start(0,off||0,dur);if(k[0]==='c')curCry=s;return true}catch(e){return false}
}
sfx.giggle=()=>{if(!play('laugh',.9))_g()};
sfx.cry=()=>{if(AC&&AC.currentTime<cryEnd)return;if(play('cryA',.9))cryEnd=AC.currentTime+SN.cryA.duration;else _c()};
sfx.fuss=()=>{if(AC&&AC.currentTime<cryEnd)return;if(play('cryA',.5))cryEnd=AC.currentTime+SN.cryA.duration;else _f()};
sfx.cryLoop=()=>{stopCry();const k=Math.random()<.5?'cryA':'cryB';if(play(k,1))cryEnd=AC.currentTime+SN[k].duration;else _l()}; // full-length recording, stops on Restart

// ===== GAME LOOP =====
function update(dt){
  t+=dt;for(const q of trail)q.l-=dt;trail=trail.filter(q=>q.l>0);if(big)big.l-=dt;
  if(frenzy>0)frenzy-=dt;if(babyHappy>0)babyHappy-=dt;if(dark>0)dark-=dt;
  if(combo>0){comboT-=dt;if(comboT<=0){combo=0;hud()}}
  idle+=dt; // milk refills when you stop swiping
  if(idle>.35&&milk<100){milk=Math.min(100,milk+(locked?18:28)*(1+.2*SV.up.refill)*dt);
    if(locked&&milk>=35){locked=false;float('MILK READY 🍼',W/2,H*.5,'#fffdf5');tone(800,.15,'sine',.12,300)}}
  if(banner>0)banner-=dt;
  else if(spawnLeft>0){spawnT-=dt;if(spawnT<=0){spawn();spawnLeft--;spawnT=swarm?.2:Math.max(.35,1.1-wave*.07)}}
  const by=H-150;
  const sl=slow>0?.4:1;if(slow>0)slow-=dt;
  for(let i=ms.length-1;i>=0;i--){
    const m=ms[i];if(m.hit>0)m.hit-=dt;
    if(m.warn){ // last-chance window before the bite
      m.hov-=dt;
      if(m.hov<=0){ms.splice(i,1);bites+=m.type==='boss'?3:1;combo=0;flash=.35;shake=9;sfx.bite();(bites>=MAX_BITES-2?sfx.cry:sfx.fuss)();vib(150);hud();
        if(bites>=MAX_BITES){gameOver();return}}
      continue;
    }
    m.y+=m.sp*sl*dt;
    m.x=Math.max(24,Math.min(W-24,m.bx+Math.sin(t*m.f+m.ph)*m.amp));
    if(m.type==='boss'){m.nt-=dt;if(m.nt<=0){m.nt=3;mk('mini',m.x,m.y)}}
    if(m.y>=by&&(m.type==='fly'||m.type==='gold')){ms.splice(i,1);continue}
    if(m.y>=by){m.warn=true;m.hov=.8;m.y=by;tone(900,.1,'square',.1)}
  }
  for(const p of its){p.y=Math.min(p.y+p.vy*dt,H-190);p.l-=dt}
  its=its.filter(p=>p.l>0);
  if(banner<=0&&spawnLeft===0&&ms.length===0){if(wave>=12&&!won){victory();return}nextWave()}
  for(const p of ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  ps=ps.filter(p=>p.l>0);
  for(const f of tx){f.y-=40*dt;f.l-=dt}
  tx=tx.filter(f=>f.l>0);
  shake*=.88;flash=Math.max(0,flash-dt);
}
function victory(){ // survived until morning
  won=true;st='win';wonT=0;sfx.giggle();vib([50,40,50,40,150]);score+=500;SV.coins+=100;
  if(score>best){best=score;try{localStorage.setItem('kp_best',best)}catch(e){}}save();
  for(let i=0;i<90;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*60,vy:60+Math.random()*120,l:4,c:['#ffd54a','#ff5d8f','#7dffb0','#8fd0ff'][i%4]});
  $('ws').textContent=score;$('hud').style.display='none';updBs();
  setTimeout(()=>$('win').classList.remove('hide'),1600);
}
function gameOver(){
  st='over';sfx.over();
  if(score>best){best=score;try{localStorage.setItem('kp_best',best)}catch(e){}}
  SV.coins+=run;save();$('fc').textContent='+'+run+' 🪙 earned';$('fs').textContent=score;$('fb').textContent='Best: '+best+'  •  Wave '+wave;
  updBs();$('hud').style.display='none';
  // AD HOOK: show interstitial here every 2-3 rounds; add "Revive" rewarded button later
  endT=0;sfx.cryLoop();setTimeout(()=>$('over').classList.remove('hide'),2400);
}

function E(x,y,rx,ry,f){ctx.fillStyle=f;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,6.28);ctx.fill()}
function drawMosqV(m){ // tiger mosquito: slim banded body, very long legs, narrow wings swept back, long proboscis
  const k=m.sz/44,fl=Math.sin(t*90+m.ph);
  ctx.save();ctx.scale(k,k);ctx.lineCap='round';ctx.lineJoin='round';
  const D1=[6,-1,-8],D2=[9,6,-15];
  for(let i=0;i<6;i++){const sd=i%2?1:-1,r=i>>1,w=Math.sin(t*5+i*1.9+m.ph)*3;
    const y0=-2+r*3.5,x1=sd*(10+r*3),y1=y0+D1[r]+w,x2=sd*(21+r*6),y2=y1+D2[r]+w;
    ctx.strokeStyle='#14100d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sd*2.5,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.strokeStyle='rgba(245,245,235,.9)';ctx.lineWidth=.9;ctx.setLineDash([2.2,6]);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
  ctx.fillStyle='rgba(220,235,255,.4)';ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.7;
  for(const sd of[-1,1]){ctx.save();ctx.translate(sd*2.5,-5);ctx.rotate(sd*(.32+fl*.22));
    ctx.beginPath();ctx.ellipse(0,-15,2.7,16,0,0,6.28);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-1);ctx.lineTo(0,-30);ctx.stroke();ctx.restore()}
  E(0,-16,3,12.5,m.warn?'#7a1414':'#16110e');E(0,-28,1.6,3,m.warn?'#7a1414':'#16110e');
  ctx.strokeStyle='#f1efe6';ctx.lineWidth=1.5;
  for(const y of[-8,-13,-18,-23]){ctx.beginPath();ctx.moveTo(-3,y);ctx.quadraticCurveTo(0,y+1.4,3,y);ctx.stroke()}
  E(0,-2,4.2,5.8,'#1b1612');
  ctx.strokeStyle='rgba(240,240,230,.9)';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,2);ctx.stroke();
  E(0,6.5,2.9,2.9,'#17120e');E(-2,6,1.5,1.9,'#05080b');E(2,6,1.5,1.9,'#05080b');E(-2.4,5.2,.5,.5,'#fff');E(1.6,5.2,.5,.5,'#fff');
  ctx.strokeStyle='#0c0c0c';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(0,9);ctx.lineTo(0,23);ctx.stroke();
  ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(-1,5);ctx.lineTo(-5,13);ctx.moveTo(1,5);ctx.lineTo(5,13);ctx.stroke();
  ctx.restore();
}
function drawMosq(m){ // real photo; two wing poses alternate fast = wing flap
  const a=IM.m1,b=IM.m2;
  if(!a||!b||!a.naturalWidth||!b.naturalWidth){drawMosqV(m);return}
  const im=Math.sin(t*(m.warn?55:38)+m.ph)>0?a:b,s=m.sz*2.1;
  ctx.save();ctx.rotate(Math.PI); // head faces the baby
  if(m.warn){ctx.shadowColor='#ff2020';ctx.shadowBlur=20}
  ctx.drawImage(im,-s/2,-s/2,s,s);ctx.restore();
}
const FA={bs:[.385,.306],bl:[.497,.247],bc:[.497,.25]}; // face anchor inside each photo
let bCur='bs',bPrev=null,bF=1;
function putBaby(key,alpha,mood){
  const im=IM[key];if(!im||!im.naturalWidth)return null;
  const w=Math.min(W*1.12,540),h=w*im.naturalHeight/im.naturalWidth,fa=FA[key];
  const cx=W/2+(mood==='cry'?Math.sin(t*32)*2.2:0),fy=H-178-(mood==='laugh'?Math.abs(Math.sin(t*9))*5:0);
  ctx.globalAlpha=alpha;ctx.drawImage(im,cx-fa[0]*w,fy-fa[1]*h,w,h);ctx.globalAlpha=1;
  return{w,cx,fy};
}
function drawBaby(mood,by){
  const key=mood==='cry'?'bc':mood==='laugh'?'bl':'bs';
  if(key!==bCur){bPrev=bCur;bCur=key;bF=0}
  bF=Math.min(1,bF+.08);
  if(bPrev&&bF<1)putBaby(bPrev,1,mood);
  const r=putBaby(bCur,bF,mood);
  if(!r){drawBed(W/2,by,mood);return}
  const P=[[-.06,-.03],[.055,-.045],[-.035,.045],[.045,.05],[0,-.065]];
  for(let i=0;i<Math.min(bites,5);i++){const x=r.cx+P[i][0]*r.w,y=r.fy+P[i][1]*r.w;
    E(x,y,r.w*.017,r.w*.017,'rgba(255,90,90,.35)');E(x,y,r.w*.007,r.w*.007,'#c92a2a')}
}
function drawFly(m){ // harmless butterfly
  const w=Math.abs(Math.sin(t*9+m.ph));
  for(const sd of[-1,1]){E(sd*13*w,-6,13*w+1,16,'#ff9d2e');E(sd*9*w,10,8*w+1,10,'#ffd166')}

    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H*.35);ctx.scale(s,s);
    ctx.font='900 52px "Trebuchet MS",system-ui,sans-serif';ctx.lineWidth=8;ctx.strokeStyle='#b5481a';
    const lb=wave%5===0?'BOSS WAVE':dark>0?'LIGHTS OUT!':swarm?'SWARM!':'Wave '+wave;ctx.strokeText(lb,0,0);ctx.fillStyle='#ffd54a';ctx.fillText(lb,0,0);ctx.restore();
  }
  // bite flash
  if(flash>0){ctx.fillStyle='rgba(255,50,50,'+flash*.5+')';ctx.fillRect(0,0,W,H)}
  ctx.restore();
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(st==='play'){if(tsT>0)tsT-=dt;update(tsT>0?dt*.35:dt)}else{t+=dt;endT+=dt;wonT+=dt;for(const p of ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}ps=ps.filter(p=>p.l>0)}
  draw();buzzUpdate();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}</script>
